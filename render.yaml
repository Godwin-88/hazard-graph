# HazardGraph — Render Blueprint (Infrastructure as Code)
# Auto-detected by Render when connected to GitHub repo.
#
# Architecture:
#   - FastAPI backend (Docker) — runs on Render Web Service
#   - Neo4j Aura Free (managed) — set NEO4J_URI in dashboard
#   - Supabase (PostgreSQL) — set POSTGRES_DSN in dashboard
#   - Upstash (Redis) — set REDIS_URL in dashboard
#
# Why Docker instead of Render's Python runtime?
#   main.py is at the repo root and imports from config/, db/, graph/,
#   auth/, models/, ingestion/, causal/, risk/, alerts/, pipeline/,
#   regime/, scheduler/ — all at the repo root. Using rootDir: api
#   would break every import. Docker copies the entire repo and works
#   correctly with the monorepo structure.

services:

  # ── FastAPI Backend (Web Service) ───────────────────
  - type: web
    name: hazardgraph-api
    runtime: docker
    plan: free
    repo: https://github.com/Godwin-88/hazard-graph
    branch: main
    dockerfilePath: ./Dockerfile
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      # ── Neo4j (Aura Free) — set your bolt:// URI in dashboard ──
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        value: neo4j
      - key: NEO4J_PASSWORD
        sync: false

      # ── Supabase (PostgreSQL) — set your asyncpg DSN in dashboard ──
      - key: POSTGRES_DSN
        sync: false

      # ── Upstash (Redis) — set your redis:// URL in dashboard ──
      - key: REDIS_URL
        sync: false

      # ── Groq LLM (advisory generation) ──
      - key: GROQ_API_KEY
        sync: false

      # ── JWT Authentication ──
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256

      # ── CORS — allow Vercel frontend ──
      - key: CORS_ORIGINS
        value: https://hazardgraph-ui.vercel.app

      # ── Africa's Talking SMS ──
      - key: AT_USERNAME
        value: sandbox
      - key: AT_API_KEY
        sync: false
      - key: AT_ENV
        value: sandbox
      - key: AT_SENDER
        value: HAZARDGRPH

      # ── FEWS NET (IPC data fallback) ──
      - key: FEWS_NET_USERNAME
        sync: false
      - key: FEWS_NET_PASSWORD
        sync: false
      - key: FEWS_NET_BASE_URL
        value: https://fdw.fews.net/api

      # ── WFP DataBridges (market prices) ──
      - key: WFP_CLIENT_ID
        sync: false
      - key: WFP_CLIENT_SECRET
        sync: false

      # ── App ──
      - key: APP_ENV
        value: production